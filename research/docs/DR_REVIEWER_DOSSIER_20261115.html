&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const bindingElement = document.getElementById(&quot;codex-visualization-bindings&quot;);
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);
  const connectorGlobals = {};
  if (bindingElement != null || mockElement != null || fileElement != null) {
    const bindings = parse(bindingElement?.textContent ?? &quot;{}&quot;);
    bindingElement?.remove();
    const values = new Map();
    for (const [name, binding] of Object.entries(bindings)) {
      if (binding.type === &quot;json&quot;) values.set(name, structuredClone(binding.value));
    }
    const pending = [bindings];
    while (pending.length) {
      const object = pending.pop();
      Object.freeze(object);
      for (const child of Object.values(object)) {
        if (child !== null &amp;&amp; typeof child === &quot;object&quot;) pending.push(child);
      }
    }
    const updates = [];
    if (mockElement != null) {
      const mocks = Object.entries(parse(mockElement.textContent));
      mockElement.remove();
      for (const [name, value] of mocks) {
        values.set(name, value);
        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;json&quot;, value } });
      }
    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {
        if (binding.type !== &quot;file&quot; || !hasOwn(files, binding.path)) continue;
        const file = files[binding.path];
        let blob = blobs.get(binding.path);
        if (blob == null) {
          const bytes = Uint8Array.fromBase64?.(file.base64) ??
            Uint8Array.from(atob(file.base64), (char) =&gt; char.charCodeAt(0));
          blob = new Blob([bytes], { type: file.mimeType });
          blobs.set(binding.path, blob);
        }
        const url = URL.createObjectURL(blob);
        urls.push(url);
        values.set(name, { name: file.name, blob, url });
        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;file&quot;, ...file } });
      }
      globalThis.addEventListener(&quot;pagehide&quot;, (event) =&gt; {
        // A persisted pagehide can restore this same document and its subscriptions.
        if (event.persisted) return;
        for (const url of urls) URL.revokeObjectURL(url);
        urls.length = 0;
      });
    }
    if (mockElement != null || fileElement != null) connectorGlobals.visualizationData = { updates };
    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current value once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;article id=&quot;dr-dossier&quot; aria-label=&quot;DR 方案分層評審材料&quot;&gt;
&lt;header&gt;
&lt;span&gt;DR 搜尋方案 · 2026/11/15 · 證據版&lt;/span&gt;
&lt;h1&gt;先確認能用，再判斷值得不值得&lt;/h1&gt;
&lt;p&gt;主案候選：Next.js ＋本地 SQLite ＋異地 MinIO ＋公司 ReBAC。目標是降低總開發與維運負擔；保留原 Backend＋ES 是有效備案。&lt;/p&gt;
&lt;div class=&quot;decision&quot;&gt;目前可支持繼續整合，還不能支持正式採用或「比沿用 ES 更省」。既有閱讀 UI 沿用；搜尋品質、更新自動化、正式授權與總成本仍有關鍵缺口。&lt;/div&gt;
&lt;nav aria-label=&quot;評審問題&quot;&gt;&lt;a class=&quot;btn&quot; href=&quot;#dr-copy&quot;&gt;1 同步&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#dr-search&quot;&gt;2 搜尋&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#dr-read&quot;&gt;3 閱讀&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#dr-update&quot;&gt;4 更新&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#dr-cost&quot;&gt;5 選型&lt;/a&gt;&lt;/nav&gt;
&lt;p&gt;每節依序看：直接回答 → 運作圖 → 證據與差距 → 決策。細節留在該節展開，無須切換獨立分頁。&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;先確認範圍與證據標記&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p&gt;唯讀搜尋、閱讀、下載；指定台灣 cluster 故障，其他 cluster 可到達；ReBAC 有備援是工作假設。每日同步是初始方向，約一小時恢復是討論起點，DR 服務時間不限一小時。&lt;/p&gt;
&lt;dl&gt;&lt;dt&gt;現況｜使用者確認&lt;/dt&gt;&lt;dd&gt;現有產品能力；不是本次 agent 已在正式環境驗收。&lt;/dd&gt;&lt;dt&gt;已測｜固定合成案例&lt;/dt&gt;&lt;dd&gt;指定配置、資料及環境的實際結果；不等於正式相容性。&lt;/dd&gt;&lt;dt&gt;設計｜下一版候選&lt;/dt&gt;&lt;dd&gt;可具體討論的責任與流程，尚未完成產品化或驗收。&lt;/dd&gt;&lt;dt&gt;未知｜會影響選型&lt;/dt&gt;&lt;dd&gt;缺資料或缺實驗，不自行當成可接受的降級。&lt;/dd&gt;&lt;/dl&gt;
&lt;p&gt;2 秒搜尋、120 秒 reader 準備、15 分鐘整體恢復曾用於研究，均不是對口已接受的正式 SLO／RTO。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/header&gt;

&lt;section id=&quot;dr-copy&quot; aria-labelledby=&quot;dr-copy-title&quot;&gt;
&lt;h2 id=&quot;dr-copy-title&quot;&gt;1｜MinIO 已同步，為什麼還會有「空副本」？&lt;/h2&gt;
&lt;p&gt;你理解得對：Pod 必須有取得資料的機制。先前把兩份不同用途的資料都稱作「副本」，沒有說清楚。&lt;/p&gt;
&lt;figure aria-label=&quot;兩層同步架構：主站發布至異地 MinIO，再安裝到 DR Pod 本地磁碟&quot;&gt;
&lt;figcaption&gt;兩層同步，兩個不同的生命週期&lt;/figcaption&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;A&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;主站：MariaDB／MinIO&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;pageId、Space、Tags、正文、page→media 關係、附件&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;原站故障時不可依賴這條來源&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;產製與發布工作【設計】&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;每日觸發 → 一致抽取 → SQLite 搜尋／內容檔＋版本清單＋附件物件 → 完整後發布版本&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;責任：產品 exporter／發布工作；不是 Pod 自動具有的能力&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;B&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;異地 MinIO：跨區保存的已發布版本&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;release／manifest／data.sqlite／media objects&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;【已測】合成檔案放入真 MinIO；【未驗】正式來源每日端到端發布&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Pod 同步元件：下載 → 校驗 → 啟用&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;起始取得版本；平時發現新版後背景下載&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;【已測】下載／hash／reader 開啟；【設計】自動偵測、重試與 readiness 管理&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;C&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;DR Pod 本地磁碟：可重建的 SQLite 檔&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;唯讀 reader 使用本地檔案；Next API 呼叫 reader&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;MinIO 有 B，不代表每個新 Pod 已有 C。附件可仍從 MinIO 取得。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/figure&gt;
&lt;div class=&quot;decision&quot;&gt;107.52 秒測的是「B 已完整存在、C 從空磁碟開始」到首條合成鏈。它不代表每次每日更新都停機，也不代表已 ready 的 DR Pod 要再等 107 秒。&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;三種起點：事故、擴容與更新怎麼區分？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;① DR Pod 已 ready&lt;/dt&gt;&lt;dd&gt;可用本地版本已在服務。事故後還需入口／身份／切流驗收；不必把完整下載放在切流之後。這是建議第一版優先評估的常態預熱方式，尚未驗證正式部署。&lt;/dd&gt;
&lt;dt&gt;② 新 Pod＋空磁碟&lt;/dt&gt;&lt;dd&gt;首次部署、擴容，或使用暫存磁碟的 Pod 被重建，才需完整安裝。若採持久磁碟且檔案完整，可重用；儲存類型與跨節點重掛能力尚未決定。Pod 重新啟動不一定等於磁碟必空。&lt;/dd&gt;
&lt;dt&gt;③ 已有舊版，正在下載新版&lt;/dt&gt;&lt;dd&gt;舊 reader 繼續服務；新檔通過驗證後才切換。下載失敗不應覆蓋舊檔。最新實驗只測同一版本的第二份檔案，詳第 4 節。&lt;/dd&gt;&lt;/dl&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;同步機制應放哪裡？第一版的具體提案&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p&gt;候選部署：每個 DR Pod 內一個同步 sidecar 負責輪詢版本、下載到共享 volume 的 staging 路徑、驗 hash 與 manifest；Next／reader supervisor 負責開啟、驗證及切換 reader。初始無可用檔時 readiness 為否，有舊版時維持服務並回報資料時間。&lt;/p&gt;
&lt;p&gt;單用 initContainer 能做初始安裝，不能替常駐 Pod 持續更新；可搭配每次發布 rolling restart，但會增加 Pod 生命週期與下載耦合。直接放進 Next supervisor 可少一個容器，卻使下載、故障重試與 Web 程序更緊密耦合。sidecar 方案增加一個管理元件，並非免費減少維運。&lt;/p&gt;
&lt;p&gt;以上是部署提案，尚未實作 Kubernetes 自動同步。團隊若已有成熟同步元件，應優先沿用並核對責任，避免重造。&lt;/p&gt;
&lt;p&gt;每天一次只說「排程頻率」。真正資料 age 還包含抽取、發布、跨區完成、Pod 安裝時間，以及失敗是否被發現；資料過期的告警／繼續服務政策待定。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;p&gt;&lt;a href=&quot;#evidence-e1&quot;&gt;查看 E1：恢復實測紀錄&lt;/a&gt;&lt;/p&gt;
&lt;details id=&quot;evidence-e1&quot;&gt;&lt;summary&gt;證據 E1：107 秒包含什麼、沒包含什麼？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;已量&lt;/dt&gt;&lt;dd&gt;1M 合成頁，SQLite 2,133,065,728 bytes；20 MiB/s 應用回應節流。下載＋hash 107.47 秒；第一個搜尋→正文→68-byte 附件鏈 107.52 秒。&lt;/dd&gt;&lt;dt&gt;未包含&lt;/dt&gt;&lt;dd&gt;正式抽取、每日排程、跨區同步、DNS／登入／切流。是同機 loopback 節流，不是 WAN 延遲／丟包模型；OS cache 未清。&lt;/dd&gt;&lt;/dl&gt;
&lt;p class=&quot;evidence&quot;&gt;E1 · round-2-evidence/result.json · cell.downloadAndHashMs=107466.52 · cell.firstChainMs=107516.53&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section id=&quot;dr-search&quot; aria-labelledby=&quot;dr-search-title&quot;&gt;
&lt;h2 id=&quot;dr-search-title&quot;&gt;2｜搜尋能跑，但找得到我要的文件嗎？&lt;/h2&gt;
&lt;p&gt;目前有「受控案例可找對」的證據，也有中文漏找的歷史反例。沒有證據支持目前 SQLite 與公司 ES 找到相同文件；前一版只展示延遲，確實漏掉了這個選型關鍵。&lt;/p&gt;
&lt;figure aria-label=&quot;搜尋 API 架構及權限篩選位置&quot;&gt;
&lt;figcaption&gt;候選搜尋架構｜正式 Next／ReBAC 整合待驗&lt;/figcaption&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;1&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Web 或 API consumer → Next 搜尋 API&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;keyword、指定 Spaces、Tags、分頁＋使用者身份&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;查詢欄位不等於授權來源&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;2&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Next 授權 adapter ↔ ReBAC&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;取得／驗證可信 Space 範圍 ∩ 使用者指定範圍&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;集合取得方式、撤權與快取契約待接；最新測試用固定可信集合&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;3&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;歸屬時效 gate → 隔離 reader → 本地 SQLite&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;keyword MATCH＋Space filter → count／排序 → pageId、title、release&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;Space 同時進 count 與 rank；Tags AND 尚未在百萬 harness 實作驗收。正式 gate 待設計：即時 role 套舊 page→Space 歸屬不一定安全，title／total／snippet 也受影響。&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;4&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;API adapter → 結果列表／consumer&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;hits、total.value／relation、可讀取的 pageId；按契約提供 excerpt&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;API 形狀相同，不代表命中、排名、分頁語意相同&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/figure&gt;
&lt;h3&gt;搜尋效果：三組已存在的證據&lt;/h3&gt;
&lt;div class=&quot;case&quot;&gt;&lt;strong&gt;A．最新 L 百萬頁：精確識別字&lt;/strong&gt;&lt;p&gt;查詢 &lt;code&gt;p000000000&lt;/code&gt; → 命中 1 頁，pageId 同為 &lt;code&gt;p000000000&lt;/code&gt;，title 為「Synthetic document p000000000 topic0」。標記命中在 title，接著取回同頁正文與附件。這證明固定 ID／內容鏈，沒有證明一般自然語言相關性。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;strong&gt;B．歷史 10k 控制組：同一批文件的漏找差異&lt;/strong&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;查詢／期望命中&lt;/th&gt;&lt;th&gt;SQLite unicode61&lt;/th&gt;&lt;th&gt;SQLite trigram&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;backup／7,500&lt;/td&gt;&lt;td&gt;7,500&lt;/td&gt;&lt;td&gt;7,500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ERR_CONN_RESET／7,500&lt;/td&gt;&lt;td&gt;7,500&lt;/td&gt;&lt;td&gt;7,500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;資料庫備份／7,500&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;7,500&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;備份／7,500&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;同來源／ops scope 的歷史配置結果。trigram 改善這組長中文，但短詞仍漏找；artifact 從 15.73 MiB 增至 35.53 MiB。不能把這組結果當作目前 L 或公司中文搜尋的實測結果。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;strong&gt;C．ES-reference：小型 Lexical fixture&lt;/strong&gt;&lt;p&gt;ES 8.17.0，standard analyzer：「資料庫」→ &lt;code&gt;chinese&lt;/code&gt; 1 頁；「ERR_CONN_RESET」→ &lt;code&gt;chinese&lt;/code&gt;、&lt;code&gt;structure&lt;/code&gt; 2 頁。來源頁含「資料庫備份流程與還原 ERR_CONN_RESET manualbeacon」。另有 AND、大頁文末命中與受控 Space 驗證。&lt;/p&gt;&lt;p&gt;這是另一份 1,107 頁 fixture，不能拿 1／2 筆與上表 7,500 筆作勝負比較。公司 ES-production 的版本、mapping、analyzer 與 query 尚未取得。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;decision&quot;&gt;已知風險是「換斷詞／查詢規則會漏找」，不是只有排名稍變。下一個效果門檻應包含中文長詞、短詞、技術碼與多關鍵字的逐頁命中對照，再談是否可接受。&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;跟 ES 的差異逐項看：哪些是引擎，哪些是我們的 API？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;文字分析／空格&lt;/dt&gt;&lt;dd&gt;實驗 ES-reference 明確使用 standard，將空格分開的詞放入 must，詞內用 cross_fields／AND 查 title 和 searchText。最新 L 沿用 MS1 建立的 FTS5 索引；建表沒有自訂 tokenizer 宣告。尚未對最新 L 補同題中文對照。公司 ES 的行為未知；不能從「a b 搜不到」直接斷定根因是空格或 ES 預設。&lt;/dd&gt;
&lt;dt&gt;排名&lt;/dt&gt;&lt;dd&gt;ES-reference 用 score 降冪＋pageId；SQLite scope 版用 bm25 欄位權重 0／2／1＋rowid。穩定排序已有局部測試，但沒有證據顯示排名相同或人工認為哪個更相關。&lt;/dd&gt;
&lt;dt&gt;Space／Tags AND&lt;/dt&gt;&lt;dd&gt;Space 在 SQLite 的 count 與 rank 都有 predicate，避免只過濾畫面卻洩露 total。Tags AND 是必要需求；本輪百萬資料／harness 未涵蓋。可設 page-tag 關係並要求全部 tag 匹配是實作方向，還不能列為已交付。&lt;/dd&gt;
&lt;dt&gt;頁面移動／撤權與快照&lt;/dt&gt;&lt;dd&gt;Space filter 只證明快照中的關係被套用，不證明該關係仍有效。例如頁面已由公開 Space 移入受限 Space，舊快照仍可能把 title、內容片段與命中數透露給原 Space 成員。需要一致版本的角色／歸屬契約，或較新的歸屬／撤權資訊與拒絕過期資料的機制。這是必要授權缺口，不能靠後續開頁時拒絕來補救搜尋洩露。&lt;/dd&gt;
&lt;dt&gt;total／分頁&lt;/dt&gt;&lt;dd&gt;S1 研究契約上限 1,000 結果、每頁最多 50，total 帶 eq／gte；不是引擎只能做這些，也不是 consumer 已同意。最新 L 只測前兩頁，不能沿用歷史契約就聲稱完整窗口都驗過。&lt;/dd&gt;
&lt;dt&gt;highlight／全文內容&lt;/dt&gt;&lt;dd&gt;ES 小型參照驗過有界 excerpt 與 HTML escaping；超過 100k code points 明示不給 highlight，但仍搜尋全文。SQLite 有 highlight 輸出子證據，最新 L 沒驗相同長文與安全顯示邊界。完整正文由閱讀路徑取得，是否符合正式 response 契約仍未知。&lt;/dd&gt;
&lt;dt&gt;進階語法／容錯&lt;/dt&gt;&lt;dd&gt;研究 API 對 wildcard 等語法明確拒絕；錯字容錯、同義詞、語言分析等正式需求未知。不能把 ES 原生能力都算成公司已使用，也不能默默移除 consumer 確實依賴的能力。&lt;/dd&gt;&lt;/dl&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;p&gt;&lt;a href=&quot;#evidence-e2&quot;&gt;查看 E2／E3：搜尋效果與測試來源&lt;/a&gt;&lt;/p&gt;
&lt;details id=&quot;evidence-e2&quot;&gt;&lt;summary&gt;效果證據的原始入口與其他候選&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p class=&quot;evidence&quot;&gt;E2 · semantic-observations.json · count=10000／term／expectedTotal／observedTotal。SEARCH_API_OPTIONS.md 記載各設定及資料範圍。&lt;/p&gt;
&lt;p&gt;同一 10k 控制組，MiniSearch default：「資料庫備份」與「備份」皆 0；Pagefind Node 新 fixture 兩者皆 7,500。另在舊 100 頁同一 bundle，「資料庫備份」Node 只有 p07，browser 有 p07／p02／p01。新 fixture 成功不抵銷舊反例；Pagefind server 行為仍有適配風險。&lt;/p&gt;
&lt;p class=&quot;evidence&quot;&gt;E3 · S1-ES-v1／http-attempt-1.json：tasks 08 Chinese、09 technical code、10 AND terms 均 passed；http-review.mjs 固定預期 IDs。core.mjs／prepare.mjs 保存 query 與 mapping。&lt;/p&gt;
&lt;p class=&quot;evidence&quot;&gt;E1 · round-1-evidence/http.jsonl：task=exact／iteration=first-chain／kind=search；payload.result.hits[0] 為上述 pageId 與 title。&lt;/p&gt;
&lt;p&gt;這些資料證明受控命中，不是正式 recall／precision 或 relevance 分數。完整同語料 ES↔最新 L 的中文命中集合與排名差異表仍缺；本次未重跑或編造這張表。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;效能另外回答：查詢夠不夠快？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p&gt;最新 L 第 1 回合 37 次搜尋，樣本 P95 755.93 ms、最慢 761.31 ms。第 3 回合背景下載期間 60 次搜尋，最慢 780.10 ms；一次一個請求，完成後等 1 秒。&lt;/p&gt;
&lt;p&gt;這是 WSL／Node HTTP harness／1M 合成頁；不是真 Next、持續多人負載或正式 SLO。歷史雲端 ES 與 SQLite 有共同契約容量對照，但不能與本機最新 L 放成同機速度排行。低延遲也不能抵銷中文漏找或 Tags 缺口。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section id=&quot;dr-read&quot; aria-labelledby=&quot;dr-read-title&quot;&gt;
&lt;h2 id=&quot;dr-read-title&quot;&gt;3｜既然頁面本來就能開，新增挑戰在哪裡？&lt;/h2&gt;
&lt;p&gt;不是重做閱讀功能。你已確認現有 page list → pageId → 取 content → editor 顯示可用。一般頁的首要整合點，確實是讓搜尋結果以同一 pageId 接回既有流程。&lt;/p&gt;
&lt;figure aria-label=&quot;既有閱讀路徑與 PDF 特例分支&quot;&gt;
&lt;figcaption&gt;沿用入口，只審查變動的接縫&lt;/figcaption&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;1&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;既有 page list【現況】／新 search results【增量】&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;兩個入口傳入同一個 pageId&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;2&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;既有頁面載入流程 → DR content adapter&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;canonical page metadata → Space 授權 → 回傳既有 UI 所需內容&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;換的是資料來源與授權接縫；不是宣稱 editor 尚未存在&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;3&lt;/div&gt;&lt;div class=&quot;node two&quot;&gt;
&lt;div&gt;&lt;strong&gt;普通頁&lt;/strong&gt;&lt;span class=&quot;fields&quot;&gt;page content／Lexical → 既有 editor&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;需核對 DR 回傳格式、ID 與版本一致&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;split&quot;&gt;&lt;strong&gt;PDF／media-based page&lt;/strong&gt;&lt;span&gt;pageId → metadata 的 mediaId／media list&lt;/span&gt;&lt;span&gt;校驗 page→media membership ＋該 Space 存取權&lt;/span&gt;&lt;span&gt;→ MinIO 私有物件 → 檔案顯示／下載路徑&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;具體 PDF viewer 與 DR 供檔整合尚未驗證&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/figure&gt;
&lt;div class=&quot;decision&quot;&gt;閱讀節改為整合檢查，不把整個既有流程算成新工程。PDF「可搜尋」、「可開啟」、「可下載且有權限」是三件事，應分別提出證據。&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;PDF：找到頁面、找到檔內文字、開檔有何不同？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;搜尋 page title／描述&lt;/dt&gt;&lt;dd&gt;索引 pageId、title、Space、Tags 與已抽取正文即可走一般結果路徑。是否取到正確 media 頁仍要具體案例核對。&lt;/dd&gt;
&lt;dt&gt;搜尋 PDF 裡面的文字&lt;/dt&gt;&lt;dd&gt;需要保留既有抽取結果或建立抽取步驟，並把 searchText 綁回 pageId 與版本。不代表每個 DR Pod 都要重跑 PDF parser。哪些附件目前會解析、抽取覆蓋與更新方式未知；本輪未測真 PDF。&lt;/dd&gt;
&lt;dt&gt;開啟／下載 PDF&lt;/dt&gt;&lt;dd&gt;從 page metadata 得到 mediaId，授權後供檔。是否需要 Range、Content-Type／Disposition、短效連結或檔案代理，依既有 viewer／consumer 契約核對；尚無大 PDF 或 Range 驗證。&lt;/dd&gt;&lt;/dl&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;ReBAC tuple 不含 media，授權實際放哪裡？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p&gt;候選責任在 Next 的檔案授權入口：接收 pageId／mediaId → 讀取可信 page metadata → 確認 mediaId 在該 page 的 media list → 從 page 解析 Space → 向 ReBAC 驗該 Space 權限 → 才供檔。使用者傳來的 Space 或 mediaId 都不能單獨當授權依據。&lt;/p&gt;
&lt;p&gt;不必為每個 media 新建 ReBAC tuple。代價是備份需保留 page→media 關係，下載入口不得讓公開 bucket URL 繞過檢查。若採簽名 URL，撤權與 URL 到期的窗口需另定。&lt;/p&gt;
&lt;p&gt;每日快照下頁面可能已移 Space 或移除附件；用舊 membership 加上目前 Space role，不一定代表目前仍應允許。需要決定可接受的權限時效，或取得可用的較新關係／撤權資訊。此問題與是否用 SQLite／ES 分開，不能只畫 ReBAC 就算完成。&lt;/p&gt;
&lt;p&gt;ReBAC 不可判定時，建議回明確不可用，不能讓 UNKNOWN 變成 ALLOW。真實服務呼叫、故障與撤權測試尚未完成。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;目前究竟驗過哪一小段？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p&gt;E1 首鏈驗過合成 pageId → 純文字正文 → 68-byte checklist 附件及內容 hash。它支持資料串接方法，沒有測正式 Lexical renderer、PDF、Range、大附件或真 ReBAC。&lt;/p&gt;
&lt;p&gt;下一個最小整合驗收：使用既有 UI 的普通頁和 media-based 頁，各從搜尋結果點入；核對內容／檔案、身份與版本。這是候選 DR adapter 的驗收，不是重新開發整套 editor。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section id=&quot;dr-update&quot; aria-labelledby=&quot;dr-update-title&quot;&gt;
&lt;h2 id=&quot;dr-update-title&quot;&gt;4｜服務正在使用，資料怎麼更新？&lt;/h2&gt;
&lt;p&gt;建議以完整新版本安裝，再切換 reader；不要覆寫正在被讀取的檔。最新實驗證明「舊 reader 可在第二份檔案下載時繼續查詢」，還沒有證明正式新版本的完整切換。&lt;/p&gt;
&lt;figure aria-label=&quot;舊版服務與新版準備兩條路徑及切換位置&quot;&gt;
&lt;figcaption&gt;部署提案｜V1／V2 是圖示版本，非最新實驗真的產生兩版&lt;/figcaption&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;mini&quot;&gt;&lt;h3&gt;現在的服務路徑&lt;/h3&gt;&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;使用者／consumer → Next&lt;/strong&gt;&lt;span&gt;查詢與既有頁面請求&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;active → reader V1&lt;/strong&gt;&lt;span&gt;本地 releases/V1/data.sqlite&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;✓&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;繼續服務 V1&lt;/strong&gt;&lt;span&gt;V2 未 ready 前不移除 V1&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;mini&quot;&gt;&lt;h3&gt;背景準備路徑&lt;/h3&gt;&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;MinIO 已發布 V2&lt;/strong&gt;&lt;span&gt;同步元件 GET → staging/V2&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;svg aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 1V35m-6-6 6 6 6-6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;hash／manifest／開啟檢查&lt;/strong&gt;&lt;span&gt;啟動新 reader V2 → probe → ready&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;div class=&quot;rail&quot;&gt;↓&lt;/div&gt;&lt;div class=&quot;node&quot;&gt;&lt;strong&gt;才允許切 active 至 V2&lt;/strong&gt;&lt;span&gt;V1 保留供在途／舊連結或回滾；策略待定&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;圖中的背景下載與舊 reader 共存有局部實驗。自動發現 V2、雙 reader 就緒後路由切換、在途請求排空、舊版本路由與 GC 是待實作／待驗設計。&lt;/p&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;a href=&quot;#evidence-update&quot;&gt;查看 E1：下載共存與替換紀錄&lt;/a&gt; · &lt;a href=&quot;#evidence-e4&quot;&gt;查看 E4：歷史失敗與版本反例&lt;/a&gt;&lt;/p&gt;
&lt;details id=&quot;evidence-update&quot;&gt;&lt;summary&gt;實驗做了什麼？圖上哪些箭頭還沒驗？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;已測：下載共存&lt;/dt&gt;&lt;dd&gt;1M 頁舊 reader 運作；第二份相同 bytes／相同 release 的檔以 20 MiB/s 下載。60 次循序搜尋全部落在實際 GET 窗口內，結果符合固定預期，最慢 0.780 秒。第二份下載＋hash 107.16 秒。&lt;/dd&gt;
&lt;dt&gt;已測：換檔／換程序&lt;/dt&gt;&lt;dd&gt;之後先停舊 worker，再啟新 PID 讀新路徑。首條新鏈觀察 44.21 ms；切換當下沒有在途請求。這不是圖上先啟新再切的完整部署方案，也不是零停機證據。&lt;/dd&gt;
&lt;dt&gt;未測：內容真的改版&lt;/dt&gt;&lt;dd&gt;V1→V2 新增／刪除／移動頁面、Tag 變動、附件關係變動、授權時效與舊連結續讀，不能用相同 release 複製替代。&lt;/dd&gt;&lt;/dl&gt;
&lt;p class=&quot;evidence&quot;&gt;E1 · round-3-evidence／SUMMARY.json、result.json、http.jsonl、proxy 與 phase logs；新舊檔 hash 保持一致。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;下載壞了、切換壞了、舊連結怎麼辦？&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;下載或校驗失敗&lt;/dt&gt;&lt;dd&gt;設計：staging 不啟用，保留 active 舊版並告警資料 age。歷史小型 MinIO release 實驗有失敗安裝保留舊版子證據；不等於正式排程和新版長期運作已驗。&lt;/dd&gt;
&lt;dt&gt;新 reader 無法 ready&lt;/dt&gt;&lt;dd&gt;設計：不切 active；診斷後重試或重新發布。若已切換才發現問題，能否回滾必須連同流量路由、健康判斷及舊檔保留驗證。最新三輪沒有完成故障回滾。&lt;/dd&gt;
&lt;dt&gt;使用者拿 V1 結果，下一個請求落在 V2&lt;/dt&gt;&lt;dd&gt;歷史原型已出現 409 的反例。可選「請求帶版本＋保留／路由到舊版」，代價是多版本；或「明確提示重新搜尋」，代價由使用者／consumer 承擔，必須取得接受。版本一致不能覆蓋撤權政策。&lt;/dd&gt;
&lt;dt&gt;清理舊版&lt;/dt&gt;&lt;dd&gt;設計：達保留期、無使用者引用或已超過允許續讀窗口後才 GC；實際引用追蹤與保留窗口尚未決定。不能僅看到新版 ready 就刪舊版。&lt;/dd&gt;&lt;/dl&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;decision&quot;&gt;若選 C，就得承擔版本同步與 reader 生命週期的自有工程。若現有 Backend／ES 已有成熟流程，沿用它可能更省；這是第 5 節的比較入口。&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;dr-cost&quot; aria-labelledby=&quot;dr-cost-title&quot;&gt;
&lt;h2 id=&quot;dr-cost-title&quot;&gt;5｜什麼條件下，應該直接保留 ES？&lt;/h2&gt;
&lt;p&gt;目前不應核准「SQLite 更省」。現在可以決定的是：是否值得補 C 的基本功能，以及 A 是否已能用很少的增量成本交付同一旅程。&lt;/p&gt;
&lt;details open&gt;&lt;summary&gt;A／B／C：不是同一個方案少幾個 Pod&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;A｜整套沿用&lt;/dt&gt;&lt;dd&gt;Next → 原 Backend → 必要 MariaDB／ES／MinIO，加既有授權整合。希望沿用 API、商業邏輯、部署與告警。是否每項依賴都必要，須盤點實際讀取路徑。成本是多種服務的異地部署／資料恢復；尚無同範圍實測總成本。&lt;/dd&gt;
&lt;dt&gt;B｜保留 ES，重做周邊&lt;/dt&gt;&lt;dd&gt;Next 新 adapter → ES ＋版本化內容／MinIO ＋ReBAC。保留搜尋語意的工具，仍要做 API、內容、授權、版本銜接，並維運 ES。不是 A 的零改動精簡版。&lt;/dd&gt;
&lt;dt&gt;C｜本地 SQLite&lt;/dt&gt;&lt;dd&gt;Next 新 adapter → 本地 reader／SQLite ＋MinIO ＋ReBAC。省去 DR ES 服務，新增索引產製、斷詞適配、每 Pod 安裝、reader 切換與版本維護。目前有限容量證據較多，但正式搜尋效果與整合尚未閉合。&lt;/dd&gt;&lt;/dl&gt;
&lt;p&gt;三者都要做的工作：資料時效、一致發布、入口切換、身份／權限、監控、備份／恢復與演練。不能全算在 C 身上，也不能宣稱 A 不需要這些。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;可直接帶去 review 的四個改選條件&lt;/h3&gt;
&lt;dl&gt;
&lt;dt&gt;① 既有語意與 client 行為不能變&lt;/dt&gt;&lt;dd&gt;&lt;strong&gt;優先 A；A 依賴過重才評 B。&lt;/strong&gt;目前缺公司 mapping／query／API 範例；已知替換引擎有中文漏找風險。最小補證：固定一批必要查詢與 response，逐項核對；不是先優化 C 的速度。&lt;/dd&gt;
&lt;dt&gt;② A 已有可沿用的部署／備份／告警／runbook&lt;/dt&gt;&lt;dd&gt;&lt;strong&gt;若可直接滿足同一 DR 旅程，A 可能是主案。&lt;/strong&gt;請 Infra／Backend owner 對照一張相同故障卡，指出哪些能直接用、哪些要新建。記接手操作步驟與人工介入；目前沒有這份盤點，不能假設 A 很貴。&lt;/dd&gt;
&lt;dt&gt;③ 允許具體搜尋差異，且 C 的自有維護可承擔&lt;/dt&gt;&lt;dd&gt;&lt;strong&gt;C 才有成為主案的依據。&lt;/strong&gt;先閉合 Tags AND、中文查詢與既有 UI／consumer 接縫，再比較同服務承諾的常態／更新資源及操作。沒有對口接受前，不把漏找或回傳差異當省成本手段。&lt;/dd&gt;
&lt;dt&gt;④ 每個 Pod 全量下載／保留兩份不能接受&lt;/dt&gt;&lt;dd&gt;&lt;strong&gt;先評估預熱或持久 volume；仍不符再比較 A/B。&lt;/strong&gt;目前 C 的 2.13GB 檔、20MiB/s 約107秒提供量級。純遠端 VFS 先前小型測試超時，不是現成備案；不能直接承諾移除本地磁碟。&lt;/dd&gt;
&lt;/dl&gt;
&lt;details&gt;&lt;summary&gt;成本怎麼算？已有數字與缺少輸入放一起&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;p&gt;以下只用合成檔做算術示例，不是正式容量／費用預估。D＝2.133GB，R＝站點數，P＝每站 reader 數。&lt;/p&gt;
&lt;dl&gt;&lt;dt&gt;每個 reader&lt;/dt&gt;&lt;dd&gt;平時一份約 D；新舊並存約 2D＝4.266GB。尚未含暫存失敗檔、日誌、真實附件與 OS cache。&lt;/dd&gt;
&lt;dt&gt;所有站點本地磁碟&lt;/dt&gt;&lt;dd&gt;若每 Pod 只留一舊一新，更新時約 R×P×2D。例：美、歐兩站，每站兩 reader，約 17.06GB；這是條件算式，不是建議副本數或完整峰值。若為舊連結保留更多版本，應改為 R×P×K×D，K 包含每 Pod 的保留版與準備版；另計失敗 staging、版本大小差異與安全餘裕。&lt;/dd&gt;
&lt;dt&gt;下載流量&lt;/dt&gt;&lt;dd&gt;若每天每個 reader 各完整下載一次，約 R×P×D／日；同例約 8.53GB／日。這是 MinIO→reader 流量，是否跨區取決於 MinIO 所在；主站→異地發布的流量另算。未驗差分同步。&lt;/dd&gt;
&lt;dt&gt;MinIO 與正文&lt;/dt&gt;&lt;dd&gt;各站保留多少版本再乘 D，另加附件物件。SQLite 的 D 已含合成正文；比 ES 必須同時計入 ES index、共同原文、備份與版本，不能只拿 ES 索引 bytes 比。&lt;/dd&gt;
&lt;dt&gt;RAM／CPU&lt;/dt&gt;&lt;dd&gt;最新 reader 採樣 RSS 約83–117MiB；測試環境約19.53GiB RAM、28 logical CPU，未設 cgroup limit，RSS 不含 OS cache。不能據此配置128MiB Pod。兩個 reader 同時存活的切換峰值未量；A/B 同條件資源與長時併發仍未量。&lt;/dd&gt;
&lt;dt&gt;一次性與持續工程&lt;/dt&gt;&lt;dd&gt;A 可沿用程度未知；B/C 的 adapter、授權、版本維護需具體 owner。實際工時、維護頻率、硬體單價與故障成本皆未知，所以目前不填虛構的 TCO 金額或節省百分比。&lt;/dd&gt;&lt;/dl&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;誰多做什麼？把維運負擔落到工作上&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
&lt;dl&gt;&lt;dt&gt;產品／Backend owner&lt;/dt&gt;&lt;dd&gt;A：確認唯讀與異地依賴。B：新 Next adapter＋ES／內容版本協調。C：另加索引產製、中文策略、同步元件／reader 協調與診斷。三者都要維持頁面與附件授權正確。&lt;/dd&gt;
&lt;dt&gt;Infra／值班 owner&lt;/dt&gt;&lt;dd&gt;A：多種既有服務的容量／備援。B：ES 與內容存放。C：每 Pod 磁碟、下載峰值、ready、過期版本／GC。三者都要入口、監控及事故演練；現有自動化可沿用多少是關鍵輸入。&lt;/dd&gt;
&lt;dt&gt;API consumer／前端 owner&lt;/dt&gt;&lt;dd&gt;A：確認 DR endpoint／唯讀行為。B/C：另核對結果欄位、語意、total／分頁、錯誤重試與舊版本鏈。一般閱讀 UI 已有；不要重算整套 editor 成本。&lt;/dd&gt;&lt;/dl&gt;
&lt;p&gt;接手比較方法：非作者按同一故障卡／runbook 操作，記步驟、主動操作時間、等待與求助；這份資料目前尚無。agent 實作時間不能充當團隊長期值班工時。&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;decision&quot;&gt;本次建議：保留 C 作候選，優先補「搜尋效果＋既有 UI 銜接」；同時取得 A 可沿用工作的盤點。這兩項最可能改變選型，繼續單邊追低延遲的決策價值較低。&lt;/div&gt;
&lt;/section&gt;

&lt;section aria-label=&quot;證據與審查狀態&quot;&gt;
&lt;h2&gt;深入核對，不必從 log 拼回結論&lt;/h2&gt;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||

      return;

      trigger == null ||
      !trigger.isConnected ||

      return;

    }

    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,

  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);

    if (node.shadowRoot) listen(node.shadowRoot);

(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
