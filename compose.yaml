# Demo only. Loopback ports; fixed reference versions, not production recommendations.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    mem_limit: 2g
  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    environment:
      MEILI_MASTER_KEY: dr-demo-local-only-key
      MEILI_NO_ANALYTICS: "true"
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meili-data:/meili_data"]
    mem_limit: 1g
  typesense:
    image: typesense/typesense:27.1
    command: --data-dir=/data --api-key=dr-demo-local-only-key
    ports: ["127.0.0.1:8108:8108"]
    volumes: ["typesense-data:/data"]
    mem_limit: 1g
volumes:
  es-data:
  meili-data:
  typesense-data:
